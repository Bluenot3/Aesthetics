<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>ZEN AI - Quantum Reactive Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --neon-cyan: #22d3ee;
            --neon-magenta: #e879f9;
            --neon-violet: #8b5cf6;
        }

        body {
            margin: 0;
            height: 100vh;
            display: grid;
            place-items: center;
            background: transparent; /* Completely transparent background */
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        /* Ambient Particles Background (Transparent now) */
        #particle-field {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .prism-card {
            position: relative;
            /* Slightly smaller dimensions */
            width: 270px;
            height: 72px;
            border-radius: 14px;
            text-decoration: none;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            /* Enhanced shadows for better separation on transparent bg */
            box-shadow: 
                0 0 0 1px rgba(34, 211, 238, 0.2),
                0 10px 30px -5px rgba(0, 0, 0, 0.5),
                0 0 40px -10px rgba(34, 211, 238, 0.3),
                0 0 80px -20px rgba(139, 92, 246, 0.2);
            transform-style: preserve-3d;
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            background: rgba(2, 6, 23, 0.6); /* Semi-transparent dark glass base */
            backdrop-filter: blur(12px); /* Glass blur */
            isolation: isolate;
        }
        
        .prism-card:hover {
            box-shadow: 
                0 0 0 1px rgba(34, 211, 238, 0.6),
                0 0 60px 0px rgba(34, 211, 238, 0.5),
                0 0 100px 10px rgba(232, 121, 249, 0.3),
                0 20px 50px -10px rgba(0, 0, 0, 0.8);
            transform: translateY(-4px) scale(1.05);
        }

        /* Enhanced Plasma */
        #plasma-canvas {
            position: absolute;
            inset: -40px; 
            width: calc(100% + 80px);
            height: calc(100% + 80px);
            z-index: 1;
            opacity: 0.8;
            animation: plasmaShift 12s linear infinite;
            will-change: transform, filter;
            mix-blend-mode: screen; /* Blends better with transparent glass */
        }

        @keyframes plasmaShift {
            0% { filter: blur(20px) contrast(1.2) saturate(1.5) hue-rotate(0deg); }
            50% { filter: blur(20px) contrast(1.2) saturate(1.5) hue-rotate(180deg); }
            100% { filter: blur(20px) contrast(1.2) saturate(1.5) hue-rotate(360deg); }
        }

        /* Multi-Layer Lightning */
        #lightning-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3; 
            pointer-events: none;
            filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.9));
        }

        /* Reactive Particle Layer */
        #particle-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.8;
        }

        /* Dynamic Grid */
        .tech-mesh {
            position: absolute;
            inset: 0;
            z-index: 2;
            background-size: 14px 14px;
            background-image: 
                linear-gradient(to right, rgba(34, 211, 238, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(34, 211, 238, 0.1) 1px, transparent 1px);
            mix-blend-mode: overlay;
            pointer-events: none;
            transition: background-size 0.4s ease;
        }

        .prism-card:hover .tech-mesh {
            background-size: 10px 10px;
            opacity: 0.8;
        }

        /* Prismatic Glass - Refined for transparency */
        .glass-surface {
            position: absolute;
            inset: 0;
            z-index: 4;
            background: linear-gradient(
                125deg, 
                rgba(255, 255, 255, 0.1) 0%, 
                rgba(255, 255, 255, 0.0) 40%,
                rgba(255, 255, 255, 0.0) 60%,
                rgba(255, 255, 255, 0.05) 100%
            );
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
            transition: all 0.6s ease;
        }
        
        .prism-card:hover .glass-surface {
            background: linear-gradient(
                125deg, 
                rgba(255, 255, 255, 0.2) 0%, 
                rgba(34, 211, 238, 0.05) 30%,
                rgba(139, 92, 246, 0.05) 70%,
                rgba(255, 255, 255, 0.1) 100%
            );
            box-shadow: 
                inset 0 0 40px rgba(34, 211, 238, 0.1), 
                inset 0 0 0 1px rgba(255,255,255,0.2);
        }

        /* Content */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
            transform: translateZ(40px);
            pointer-events: none; 
        }

        .label-top {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 10px; /* Scaled down slightly */
            letter-spacing: 0.9em; 
            color: #94a3b8;
            margin-bottom: 2px;
            text-shadow: 0 2px 8px rgba(0,0,0,1), 0 0 20px rgba(34, 211, 238, 0.3);
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            margin-right: -0.9em;
            animation: labelPulse 3s ease-in-out infinite;
        }

        @keyframes labelPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .prism-card:hover .label-top {
            color: #fff;
            letter-spacing: 1.1em;
            margin-right: -1.1em;
            text-shadow: 
                0 2px 8px rgba(0,0,0,1), 
                0 0 30px rgba(34, 211, 238, 0.8), 
                0 0 60px rgba(34, 211, 238, 0.4);
        }

        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 24px; /* Scaled down slightly */
            letter-spacing: 0.15em;
            color: white;
            text-transform: uppercase;
            -webkit-text-stroke: 1px rgba(0,0,0,0.8); 
            text-shadow: 
                0 4px 16px rgba(0,0,0,1),
                0 0 20px rgba(34, 211, 238, 0.3);
            position: relative;
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.1));
        }

        .prism-card:hover .main-title {
            text-shadow: 
                0 0 30px rgba(255, 255, 255, 0.8), 
                0 0 60px rgba(34, 211, 238, 0.6), 
                0 0 90px rgba(139, 92, 246, 0.4);
            transform: scale(1.05);
            -webkit-text-stroke: 0.5px rgba(0,0,0,0.5);
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.5));
        }

        /* Multi-Color Flowing Border */
        .glow-border {
            position: absolute;
            inset: -1px;
            border-radius: 16px;
            background: linear-gradient(
                90deg, 
                #22d3ee 0%, 
                #8b5cf6 25%, 
                #e879f9 50%, 
                #8b5cf6 75%, 
                #22d3ee 100%
            );
            background-size: 300% 100%;
            z-index: 0;
            opacity: 0.4; 
            filter: blur(15px);
            animation: borderFlow 6s linear infinite; 
            transition: all 0.6s ease;
        }

        .prism-card:hover .glow-border {
            opacity: 0.8;
            filter: blur(20px);
            animation: borderFlow 1.5s linear infinite;
            inset: -2px;
        }

        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* Energy Rings */
        .energy-ring {
            position: absolute;
            inset: -8px;
            border-radius: 18px;
            border: 1px solid rgba(34, 211, 238, 0.3);
            z-index: 0;
            opacity: 0;
            transform: scale(1);
            pointer-events: none;
            animation: ringPulse 3s ease-out infinite;
        }

        .energy-ring:nth-child(2) {
            animation-delay: 1s;
        }

        .energy-ring:nth-child(3) {
            animation-delay: 2s;
        }

        @keyframes ringPulse {
            0% { 
                transform: scale(1); 
                opacity: 0.5;
            }
            100% { 
                transform: scale(1.25); 
                opacity: 0;
            }
        }

        .prism-card:hover .energy-ring {
            animation: ringPulse 1.2s ease-out infinite;
        }

    </style>
</head>
<body>

    <canvas id="particle-field"></canvas>

    <a href="https://us.zenai.biz" class="prism-card" id="card" target="_top">
        <div class="energy-ring"></div>
        <div class="energy-ring"></div>
        <div class="energy-ring"></div>
        <div class="glow-border"></div>
        <div class="tech-mesh"></div>
        <canvas id="plasma-canvas"></canvas>
        <canvas id="particle-canvas"></canvas>
        <canvas id="lightning-canvas"></canvas>
        <div class="glass-surface"></div>

        <div class="content">
            <div class="label-top">ZEN</div>
            <div class="main-title">AI ARENA</div>
        </div>
    </a>

    <script>
        const card = document.getElementById('card');
        const plasmaCanvas = document.getElementById('plasma-canvas');
        const particleCanvas = document.getElementById('particle-canvas');
        const lightningCanvas = document.getElementById('lightning-canvas');
        const bgCanvas = document.getElementById('particle-field');
        
        const pCtx = plasmaCanvas.getContext('2d');
        const partCtx = particleCanvas.getContext('2d');
        const lCtx = lightningCanvas.getContext('2d');
        const bgCtx = bgCanvas.getContext('2d');

        let width, height;
        let lastTime = 0;
        let time = 0;
        let isHovering = false;
        
        let mousePos = { x: 0, y: 0 };
        let sourcePos = { x: 0, y: 0 };
        
        let lightningBolts = [];
        let anchorPoints = [];
        let particles = [];
        let bgParticles = [];

        // Navigation
        card.addEventListener('click', (e) => {
            e.preventDefault();
            try {
                window.top.location.href = "https://us.zenai.biz";
            } catch (err) {
                window.open("https://us.zenai.biz", "_blank");
            }
        });

        // Enhanced Plasma Blobs
        const blobs = [
            { color: '#0891b2', speed: 0.35, offset: 0, rMult: 1.1 },
            { color: '#9333ea', speed: 0.45, offset: 2, rMult: 1.0 },
            { color: '#db2777', speed: 0.25, offset: 4, rMult: 1.2 },
            { color: '#2563eb', speed: 0.55, offset: 1, rMult: 0.9 },
            { color: '#ec4899', speed: 0.3, offset: 3, rMult: 1.15 },
            { color: '#22d3ee', speed: 0.15, offset: 5, rMult: 1.4 },
        ];

        // Particle System
        class Particle {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = 1;
                this.decay = 0.02; // Faster decay
                this.size = (Math.random() * 2 + 1);
            }

            update(dt) {
                this.x += this.vx * dt * 60;
                this.y += this.vy * dt * 60;
                this.life -= this.decay;
            }

            draw(ctx) {
                ctx.fillStyle = `rgba(${this.color}, ${this.life})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Background Particle
        class BGParticle {
            constructor(width, height) {
                this.width = width;
                this.height = height;
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.size = Math.random() * 2.5; // Slightly larger for clarity
                this.opacity = Math.random() * 0.4 + 0.1;
                this.pulseSpeed = Math.random() * 0.05 + 0.01;
                this.pulse = Math.random() * Math.PI;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.pulse += this.pulseSpeed;

                if (this.x < 0 || this.x > this.width) this.vx *= -1;
                if (this.y < 0 || this.y > this.height) this.vy *= -1;
            }

            draw(ctx) {
                const currentOp = this.opacity + Math.sin(this.pulse) * 0.1;
                ctx.fillStyle = `rgba(34, 211, 238, ${Math.max(0, currentOp)})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Lightning Bolt Class
        class Bolt {
            constructor(index) {
                this.index = index;
                this.progress = 0; 
                this.segments = [];
                // Brighter colors for upscaled look
                this.color = index % 3 === 0 ? '#67e8f9' : (index % 3 === 1 ? '#f0abfc' : '#c4b5fd');
            }

            generate(x1, y1, x2, y2) {
                this.segments = [];
                this.segments.push({x: x1, y: y1});

                const dist = Math.sqrt(Math.pow(x2-x1, 2) + Math.pow(y2-y1, 2));
                const baseDisplacement = dist * 0.3;

                const createSegments = (sx, sy, ex, ey, displacement, iteration) => {
                    if (iteration <= 0) {
                        this.segments.push({x: ex, y: ey});
                        return;
                    }
                    const midX = (sx + ex) / 2;
                    const midY = (sy + ey) / 2;
                    
                    const dx = ex - sx;
                    const dy = ey - sy;
                    const nx = -dy; 
                    const ny = dx;
                    const len = Math.sqrt(nx*nx + ny*ny) || 1;
                    
                    const scale = (Math.random() - 0.5) * displacement;
                    
                    const pX = midX + (nx/len) * scale;
                    const pY = midY + (ny/len) * scale;

                    createSegments(sx, sy, pX, pY, displacement * 0.5, iteration - 1);
                    createSegments(pX, pY, ex, ey, displacement * 0.5, iteration - 1);
                };

                createSegments(x1, y1, x2, y2, baseDisplacement, 6);
            }

            update(dt) {
                const targetProgress = isHovering ? 1 : 0;
                const speed = isHovering ? 4.0 : 2.5; 
                this.progress += (targetProgress - this.progress) * speed * dt;
                
                if (this.progress > 1) this.progress = 1;
                if (this.progress < 0) this.progress = 0;
            }

            draw(ctx) {
                if (this.progress < 0.01 || !this.segments || this.segments.length === 0) return;

                let limit = Math.floor(this.segments.length * this.progress);
                if (limit > this.segments.length) limit = this.segments.length;
                if (limit < 2) return;

                ctx.beginPath();
                const start = this.segments[0];
                ctx.moveTo(start.x, start.y);

                for (let i = 1; i < limit; i++) {
                    ctx.lineTo(this.segments[i].x, this.segments[i].y);
                }
                
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2.0; // Thicker for upscale
                ctx.shadowBlur = 25;
                ctx.shadowColor = this.color;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.0;
                ctx.shadowBlur = 0;
                ctx.stroke();

                // Enhanced branches
                if (this.progress > 0.7) {
                    for (let i = 5; i < limit - 5; i += 7) { 
                        if (Math.random() > 0.3) continue;
                        
                        const p = this.segments[i];
                        const nextP = this.segments[i+1];
                        if (!p || !nextP) continue;

                        const angle = Math.atan2(nextP.y - p.y, nextP.x - p.x);
                        const branchAngle = angle + (Math.random() < 0.5 ? 1 : -1) * (0.6 + Math.random() * 0.9);
                        const branchLen = 15 + Math.random() * 30;
                        
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(
                            p.x + Math.cos(branchAngle) * branchLen,
                            p.y + Math.sin(branchAngle) * branchLen
                        );
                        ctx.strokeStyle = this.color;
                        ctx.lineWidth = 0.8;
                        ctx.shadowBlur = 15;
                        ctx.stroke();
                    }
                }
            }
        }

        // Upscaling Factor
        // We force a minimum 2x multiplier for crispness on all screens
        const highResScale = Math.max(window.devicePixelRatio || 1, 2.0);

        function resize() {
            const rect = card.getBoundingClientRect();
            // Expanded bounds for plasma spillover
            width = rect.width + 80; 
            height = rect.height + 80;
            
            const lWidth = rect.width;
            const lHeight = rect.height;

            // Plasma setup
            plasmaCanvas.width = width * highResScale;
            plasmaCanvas.height = height * highResScale;
            pCtx.resetTransform();
            pCtx.scale(highResScale, highResScale);
            
            // Particle setup
            particleCanvas.width = lWidth * highResScale;
            particleCanvas.height = lHeight * highResScale;
            partCtx.resetTransform();
            partCtx.scale(highResScale, highResScale);
            
            // Lightning setup
            lightningCanvas.width = lWidth * highResScale;
            lightningCanvas.height = lHeight * highResScale;
            lCtx.resetTransform();
            lCtx.scale(highResScale, highResScale);

            // Background setup
            bgCanvas.width = window.innerWidth * highResScale;
            bgCanvas.height = window.innerHeight * highResScale;
            bgCtx.resetTransform();
            bgCtx.scale(highResScale, highResScale);

            blobs.forEach(b => {
                b.baseR = Math.min(width, height) * b.rMult * 0.8;
            });

            anchorPoints = [];
            lightningBolts = [];
            const cx = lWidth / 2;
            const cy = lHeight / 2;
            const radius = Math.max(lWidth, lHeight) * 0.8;

            for (let i = 0; i < 9; i++) {
                const angle = (Math.PI * 2 / 9) * i - (Math.PI / 2); 
                const ax = cx + Math.cos(angle) * radius;
                const ay = cy + Math.sin(angle) * radius;
                anchorPoints.push({x: ax, y: ay});
                
                lightningBolts.push(new Bolt(i));
            }

            sourcePos = { x: cx, y: cy };
            if (!isHovering) {
                mousePos = { x: cx, y: cy };
            }

            // Init background particles
            bgParticles = [];
            for (let i = 0; i < 40; i++) {
                bgParticles.push(new BGParticle(window.innerWidth, window.innerHeight));
            }
        }

        window.addEventListener('resize', resize);
        // Initial resize
        resize();

        card.addEventListener('mouseenter', () => { 
            isHovering = true;
        });
        
        card.addEventListener('mouseleave', () => { 
            isHovering = false;
        });
        
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            mousePos.x = e.clientX - rect.left;
            mousePos.y = e.clientY - rect.top;
            
            // Spawn particles on hover movement
            if (Math.random() > 0.6) {
                const colors = ['34, 211, 238', '139, 92, 246', '232, 121, 249'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(
                    mousePos.x,
                    mousePos.y,
                    (Math.random() - 0.5) * 3,
                    (Math.random() - 0.5) * 3,
                    color
                ));
            }
            
            const xNorm = (e.clientX - rect.left) / rect.width;
            const yNorm = (e.clientY - rect.top) / rect.height;
            const tiltX = (yNorm - 0.5) * -20; 
            const tiltY = (xNorm - 0.5) * 20;
            card.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale(1.05)`;
        });

        function animate(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = timestamp;

            if (!width || !height) {
                requestAnimationFrame(animate);
                return;
            }

            // Background particles - Clear completely for transparency
            bgCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            
            bgParticles.forEach(p => {
                p.update();
                p.draw(bgCtx);
            });

            // Plasma
            pCtx.clearRect(0, 0, width, height);
            
            const flowSpeed = isHovering ? 2.0 : 1.0;
            time += dt * flowSpeed;

            // Use 'screen' to blend blobs additively without a dark background
            pCtx.globalCompositeOperation = 'screen'; 
            blobs.forEach((blob, i) => {
                const movementRadius = width * 0.4;
                const nx = Math.sin(time * blob.speed + blob.offset) * movementRadius;
                const ny = Math.cos(time * blob.speed * 0.75 + blob.offset * 1.5) * (height * 0.4);
                
                const drawX = (width / 2) + nx;
                const drawY = (height / 2) + ny;
                const radius = blob.baseR;

                const gradient = pCtx.createRadialGradient(drawX, drawY, 0, drawX, drawY, radius);
                gradient.addColorStop(0, blob.color);
                gradient.addColorStop(1, `rgba(0,0,0,0)`);

                pCtx.fillStyle = gradient;
                pCtx.beginPath();
                pCtx.arc(drawX, drawY, radius, 0, Math.PI * 2);
                pCtx.fill();
            });
            pCtx.globalCompositeOperation = 'source-over';

            // Particles
            partCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.update(dt);
                p.draw(partCtx);
            });

            // Lightning
            const lRect = lightningCanvas.getBoundingClientRect();
            lCtx.clearRect(0, 0, lRect.width, lRect.height);
            
            const cx = lRect.width / 2;
            const cy = lRect.height / 2;

            const targetX = isHovering ? mousePos.x : cx;
            const targetY = isHovering ? mousePos.y : cy;

            const lerpSpeed = 10.0;
            sourcePos.x += (targetX - sourcePos.x) * lerpSpeed * dt;
            sourcePos.y += (targetY - sourcePos.y) * lerpSpeed * dt;

            lightningBolts.forEach((bolt, i) => {
                bolt.update(dt);
                const anchor = anchorPoints[i];
                if (!anchor) return;
                
                if (bolt.progress > 0.01) {
                    bolt.generate(sourcePos.x, sourcePos.y, anchor.x, anchor.y);
                    bolt.draw(lCtx);
                }
            });

            // Energy core
            const maxProgress = Math.max(...lightningBolts.map(b => b.progress));
            if (maxProgress > 0.01) {
                const g = lCtx.createRadialGradient(sourcePos.x, sourcePos.y, 0, sourcePos.x, sourcePos.y, 60);
                g.addColorStop(0, `rgba(255, 255, 255, ${maxProgress})`);
                g.addColorStop(0.3, `rgba(34, 211, 238, ${maxProgress * 0.8})`);
                g.addColorStop(0.6, `rgba(139, 92, 246, ${maxProgress * 0.5})`);
                g.addColorStop(1, 'transparent');
                lCtx.fillStyle = g;
                lCtx.beginPath();
                lCtx.arc(sourcePos.x, sourcePos.y, 60, 0, Math.PI * 2);
                lCtx.fill();
            }

            if (!isHovering) {
                 card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
            }

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

    </script>
</body>
</html>
